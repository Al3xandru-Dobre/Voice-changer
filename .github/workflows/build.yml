# Build + test matrix (Milestone 1.5 / Stage 01; ORT legs added in Milestone 4).
#
# Portability gate: every push to master and every PR builds fluxvoice with
# warnings-as-errors and runs the CTest suite (all tests are hardware-free —
# CLI cases are rejected before any audio context exists, unit tests never
# open a device). Runners have no sound cards; miniaudio may fall back to its
# null backend there, which the tests must tolerate. Anything needing real
# audio hardware belongs to stage 06's manual per-OS matrix.
#
# Legs: four ORT-less legs (linux-gcc, linux-clang, windows-msvc,
# macos-clang) plus one ONNX Runtime leg per OS (linux-gcc-ort,
# windows-msvc-ort, macos-clang-ort) configured with
# -DFLUXVOICE_FETCH_ORT=ON — the pinned v1.31.0 SDK (SHA-256 verified in
# cmake/OnnxRuntime.cmake) is fetched into ort-downloads/ outside the build
# tree, cached under a key derived from that file's hash and the OS, and the
# full CTest suite runs, so test_ort_model, the DLL staging next to the
# executables and the ORT version check execute natively on each OS. On the
# Linux legs xvfb + Mesa llvmpipe also run the headless gui_smoke_* CTest
# cases (xvfb-run + LIBGL_ALWAYS_SOFTWARE, registered only where xvfb-run
# exists); macOS/Windows GUI smoke stays a manual frontend/README.md §8 step.
#
# Action versions are pinned to major tags (v5 = node-24 runtime) for the
# same reproducibility / supply-chain reasons as the GIT_TAG pins in
# CMakeLists.txt.
name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,    os: ubuntu-latest,  cc: gcc,   cxx: g++ }
          - { name: linux-clang,  os: ubuntu-latest,  cc: clang, cxx: clang++ }
          - { name: windows-msvc, os: windows-latest }
          - { name: macos-clang,  os: macos-latest,  cc: /usr/bin/clang, cxx: /usr/bin/clang++, cmake_args: "-DCMAKE_OSX_DEPLOYMENT_TARGET=13.0" }
          # ONNX Runtime legs (-DFLUXVOICE_FETCH_ORT=ON): test_ort_model, the
          # DLL staging and the version check run natively on each OS.
          - { name: linux-gcc-ort,    os: ubuntu-latest,  cc: gcc,   cxx: g++,   ort: ON }
          - { name: windows-msvc-ort, os: windows-latest, ort: ON }
          - { name: macos-clang-ort,  os: macos-latest,  cc: /usr/bin/clang, cxx: /usr/bin/clang++, ort: ON, cmake_args: "-DCMAKE_OSX_DEPLOYMENT_TARGET=13.0" }

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # Exported via GITHUB_ENV so entries without cc/cxx (windows-msvc)
      # never see an empty CC/CXX variable.
      - name: Select compilers
        if: matrix.cc != ''
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Cache FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-${{ matrix.name }}-

      # The pinned ORT SDK archive (version + SHA-256 live in this file) is
      # kept outside the build tree, so the cache survives build/ removal and
      # the download runs once per OS per pin. A cached file is still
      # URL_HASH-verified by CMake before use.
      - name: Cache ONNX Runtime SDK archive
        if: matrix.ort == 'ON'
        uses: actions/cache@v5
        with:
          path: ort-downloads
          key: ort-sdk-${{ runner.os }}-${{ hashFiles('cmake/OnnxRuntime.cmake') }}

      # SDL3 (Milestone 4 frontend) builds from source on the Linux legs and
      # needs the X11 extension headers at configure time (it dlopens the
      # libraries at runtime). Wayland/EGL headers enable native Wayland.
      # xvfb + the Mesa software GL driver (llvmpipe) let the headless
      # gui_smoke_* CTest cases run under xvfb-run (frontend/README.md §8).
      - name: Install SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxfixes-dev libxss-dev libxinerama-dev libxtst-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev \
            libwayland-dev libdecor-0-dev libdbus-1-dev xvfb libgl1-mesa-dri

      - name: Toolchain versions
        run: cmake --version

      # Log the actual compiler for the portable legs; on windows-msvc the
      # configure step already prints the MSVC toolchain ID and version.
      - name: Compiler version
        if: runner.os != 'Windows'
        shell: bash
        run: '"$CXX" --version'

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DFLUXVOICE_STRICT_WARNINGS=ON
          -DFLUXVOICE_WARNINGS_AS_ERRORS=ON
          ${{ matrix.cmake_args }}
          ${{ matrix.ort == 'ON' && format('-DFLUXVOICE_FETCH_ORT=ON -DFLUXVOICE_ORT_DOWNLOAD_DIR={0}/ort-downloads', github.workspace) || '' }}

      # --config is a no-op on single-config generators and selects the
      # configuration to build on the multi-config Visual Studio generator.
      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  # Milestone 2 & 3 contract, ONNX fixture, S2UT data-prep & SimulEval tests
  # (BUG-009): runs with the CPU/wheel subset of uv.lock (no CUDA torch wheels).
  python-m2:
    name: python-m2-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the pinned ONNX & S2UT harness subset of uv.lock
        run: |
          python - > ci-requirements.txt <<'EOF'
          import tomllib
          with open("python_training/uv.lock", "rb") as f:
              pkgs = {p["name"]: p for p in tomllib.load(f)["package"]}
          todo = ["numpy", "onnx", "onnxruntime", "pytest", "sacrebleu",
                  "sentencepiece", "jiwer", "soundfile", "soxr"]
          pins = {}
          while todo:
              name = todo.pop()
              if name in pins:
                  continue
              pins[name] = pkgs[name]["version"]
              todo += [d["name"] for d in pkgs[name].get("dependencies", []) if "marker" not in d]
          print("\n".join(f"{n}=={v}" for n, v in sorted(pins.items())))
          EOF
          cat ci-requirements.txt
          python -m pip install --only-binary=:all: -r ci-requirements.txt

      - name: Test
        working-directory: python_training
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/test_contract.py tests/test_fixtures.py
          tests/test_prepare_s2ut_data.py tests/test_eval_s2ut.py
          tests/test_waitk_policy.py
          && python -m gate_s2ut --self-test
