# Build + test matrix (Milestone 1.5 / Stage 01).
#
# Portability gate: every push to master and every PR builds fluxvoice with
# warnings-as-errors and runs the CTest suite (all tests are hardware-free —
# CLI cases are rejected before any audio context exists, unit tests never
# open a device). Runners have no sound cards; miniaudio may fall back to its
# null backend there, which the tests must tolerate. Anything needing real
# audio hardware belongs to stage 06's manual per-OS matrix.
#
# Action versions are pinned to major tags (v5 = node-24 runtime) for the
# same reproducibility / supply-chain reasons as the GIT_TAG pins in
# CMakeLists.txt.
name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,    os: ubuntu-latest,  cc: gcc,   cxx: g++ }
          - { name: linux-clang,  os: ubuntu-latest,  cc: clang, cxx: clang++ }
          - { name: windows-msvc, os: windows-latest }
          - { name: macos-clang,  os: macos-latest,  cc: /usr/bin/clang, cxx: /usr/bin/clang++, cmake_args: "-DCMAKE_OSX_DEPLOYMENT_TARGET=13.0" }

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # Exported via GITHUB_ENV so entries without cc/cxx (windows-msvc)
      # never see an empty CC/CXX variable.
      - name: Select compilers
        if: matrix.cc != ''
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Cache FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-${{ matrix.name }}-

      - name: Toolchain versions
        run: cmake --version

      # Log the actual compiler for the portable legs; on windows-msvc the
      # configure step already prints the MSVC toolchain ID and version.
      - name: Compiler version
        if: runner.os != 'Windows'
        shell: bash
        run: '"$CXX" --version'

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DFLUXVOICE_STRICT_WARNINGS=ON
          -DFLUXVOICE_WARNINGS_AS_ERRORS=ON
          ${{ matrix.cmake_args }}

      # --config is a no-op on single-config generators and selects the
      # configuration to build on the multi-config Visual Studio generator.
      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  # Milestone 2 stage 02 tests that need onnx / onnxruntime (BUG-009): fixture
  # byte-identical regeneration and ORT bit-exactness. A full `uv sync --frozen`
  # would pull the CUDA torch wheels, so install only this subset, at the
  # versions uv.lock pins (with their unconditional dependencies).
  python-m2:
    name: python-m2-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the pinned ONNX subset of uv.lock
        run: |
          python - > ci-requirements.txt <<'EOF'
          import tomllib
          with open("python_training/uv.lock", "rb") as f:
              pkgs = {p["name"]: p for p in tomllib.load(f)["package"]}
          todo, pins = ["numpy", "onnx", "onnxruntime", "pytest"], {}
          while todo:
              name = todo.pop()
              if name in pins:
                  continue
              pins[name] = pkgs[name]["version"]
              todo += [d["name"] for d in pkgs[name].get("dependencies", []) if "marker" not in d]
          print("\n".join(f"{n}=={v}" for n, v in sorted(pins.items())))
          EOF
          cat ci-requirements.txt
          python -m pip install --only-binary=:all: -r ci-requirements.txt

      - name: Test
        working-directory: python_training
        run: python -m pytest -q -p no:cacheprovider tests/test_contract.py tests/test_fixtures.py
